<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code · Session Search</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --fg:#e6e9ef; --muted:#8b93a3; --accent:#c98b5e; --accent2:#6ea8fe;
    --good:#5ec98b; --chip:#242935;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }
  header {
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:20px 24px 12px; border-bottom:1px solid var(--border);
  }
  h1 { margin:0 0 4px; font-size:17px; font-weight:600; letter-spacing:.2px; }
  h1 .sub { color:var(--muted); font-weight:400; font-size:13px; margin-left:8px; }
  .searchrow { display:flex; gap:10px; margin-top:12px; }
  #q {
    flex:1; background:var(--panel); border:1px solid var(--border); color:var(--fg);
    border-radius:10px; padding:12px 14px; font-size:15px; outline:none;
  }
  #q:focus { border-color:var(--accent2); }
  button {
    background:var(--panel2); color:var(--fg); border:1px solid var(--border);
    border-radius:9px; padding:0 14px; font-size:13px; cursor:pointer; height:44px;
  }
  button:hover { border-color:var(--accent2); }
  button.ghost { height:28px; padding:0 10px; font-size:12px; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; min-height:16px; }
  main { padding:16px 24px 60px; max-width:960px; }
  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:12px;
  }
  .card:hover { border-color:#39414f; }
  .ctop { display:flex; align-items:baseline; gap:10px; }
  .score {
    font-variant-numeric:tabular-nums; font-size:12px; color:var(--bg);
    background:var(--accent); border-radius:6px; padding:2px 7px; font-weight:600;
    flex:none;
  }
  .title { font-weight:600; font-size:15px; }
  .snippet { color:#c5ccd8; margin:8px 0 10px; font-size:13.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip {
    background:var(--chip); border:1px solid var(--border); color:var(--muted);
    border-radius:20px; padding:2px 10px; font-size:11.5px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chip b { color:#b9c1cf; font-weight:500; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  code.sid { color:var(--accent2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .empty { color:var(--muted); text-align:center; margin-top:60px; font-size:14px; }
  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--border); color:var(--fg);
    padding:10px 16px; border-radius:10px; font-size:13px; opacity:0;
    transition:opacity .2s; pointer-events:none;
  }
  .toast.show { opacity:1; }
  .toast.err { border-color:#c9695e; }
  kbd { background:var(--chip); border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Claude Code · Session Search <span class="sub" id="sub">semantic — search by what it was about</span></h1>
  <div class="searchrow">
    <input id="q" placeholder="Describe what you remember… e.g. “the split tunnel VPN debugging thing” or “renovate PRs for the gateway”" autofocus>
    <button id="reindex" title="Rescan ~/.claude/projects for new/changed sessions">↻ Reindex</button>
  </div>
  <div class="meta" id="meta">Type to search. Ranking is by meaning, not keywords — <kbd>Enter</kbd> also works.</div>
</header>
<main id="results"></main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const results = $("#results"), meta = $("#meta"), toast = $("#toast");
let timer = null, lastQuery = "";

function showToast(msg, isErr=false) {
  toast.textContent = msg;
  toast.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.className = "toast", 2200);
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"});
}
function shortProject(p) {
  if (!p) return "";
  return p.replace(/^\/Users\/[^/]+/, "~");
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function search(q) {
  q = q.trim();
  lastQuery = q;
  if (!q) { results.innerHTML = ""; meta.textContent = "Type to search."; return; }
  meta.textContent = "Searching…";
  try {
    const r = await fetch("/api/search?k=25&q=" + encodeURIComponent(q));
    const data = await r.json();
    if (data.query !== lastQuery) return; // stale response
    render(data.results);
    meta.textContent = data.count + " matches — ranked by semantic similarity";
  } catch (e) {
    meta.textContent = "Search failed: " + e;
  }
}

function render(rows) {
  if (!rows.length) { results.innerHTML = '<div class="empty">No sessions matched. Try describing it differently.</div>'; return; }
  results.innerHTML = rows.map(r => {
    const proj = shortProject(r.cwd || r.project);
    const branch = r.git_branch && r.git_branch !== "HEAD" ? r.git_branch : "";
    return `<div class="card">
      <div class="ctop">
        <span class="score">${r.score.toFixed(2)}</span>
        <span class="title">${esc(r.title)}</span>
      </div>
      <div class="snippet">${esc(r.snippet)}</div>
      <div class="chips">
        ${proj ? `<span class="chip" title="${esc(r.cwd||r.project)}"><b>📁</b> ${esc(proj)}</span>`:""}
        ${branch ? `<span class="chip"><b>⑂</b> ${esc(branch)}</span>`:""}
        ${r.last_ts ? `<span class="chip"><b>🕑</b> ${fmtDate(r.last_ts)}</span>`:""}
        <span class="chip"><b>💬</b> ${r.msg_count} msgs</span>
        <span class="chip"><code class="sid">${r.session_id.slice(0,8)}…</code></span>
      </div>
      <div class="actions">
        <button class="ghost" onclick='copyCmd(${JSON.stringify(r.resume_cmd)})'>⧉ Copy resume command</button>
        <button class="ghost" onclick='copyId(${JSON.stringify(r.session_id)})'>⧉ Copy ID</button>
        <button class="ghost" onclick='openIterm(${JSON.stringify(r.cwd||r.project)}, ${JSON.stringify(r.session_id)})'>▸ Open in iTerm2</button>
      </div>
    </div>`;
  }).join("");
}

async function copyCmd(cmd){ await navigator.clipboard.writeText(cmd); showToast("Resume command copied — paste in a terminal"); }
async function copyId(id){ await navigator.clipboard.writeText(id); showToast("Session ID copied: " + id.slice(0,8) + "…"); }
async function openIterm(cwd, id){
  showToast("Opening iTerm2…");
  try {
    const r = await fetch("/api/resume", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({cwd, session_id:id})});
    const d = await r.json();
    showToast(d.message || (d.ok ? "Opened" : "Failed"), !d.ok);
  } catch(e){ showToast("Failed: " + e, true); }
}

$("#q").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => search(e.target.value), 250);
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(timer); search(e.target.value); }});

$("#reindex").addEventListener("click", async () => {
  meta.textContent = "Reindexing (scanning ~/.claude/projects)…";
  try {
    const r = await fetch("/api/reindex", {method:"POST"});
    const d = await r.json();
    showToast(`Reindexed: ${d.sessions} sessions (${d.embedded} new/changed)`);
    if (lastQuery) search(lastQuery);
    else meta.textContent = d.sessions + " sessions indexed. Type to search.";
  } catch(e){ showToast("Reindex failed: " + e, true); }
});

fetch("/api/stats").then(r=>r.json()).then(d=>{ $("#sub").textContent = `semantic search over ${d.sessions} sessions`; });
</script>
</body>
</html>
